name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: "34 19 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Update data
        run: |
          work="$(mktemp -d)"

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/PokeAPI/api-data.git "$work/api-data"
          git -C "$work/api-data" sparse-checkout set data/api/v2

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/PokeAPI/sprites.git "$work/sprites"
          git -C "$work/sprites" sparse-checkout set --no-cone \
            '/sprites/pokemon/*.png' \
            '/sprites/pokemon/other/showdown/*.gif'

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/PokeAPI/cries.git "$work/cries"
          git -C "$work/cries" sparse-checkout set cries

          rm -rf api sprites cries
          cp -a "$work/api-data/data/api" api
          cp -a "$work/sprites/sprites" sprites
          cp -a "$work/cries/cries" cries

          git add api sprites cries

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update PokeAPI data"
          git push
