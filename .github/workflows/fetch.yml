name: Update data

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "34 19 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build data
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/PokeAPI/api-data.git "$RUNNER_TEMP/api-data"
          git -C "$RUNNER_TEMP/api-data" sparse-checkout set --no-cone \
            '/data/api/v2/**'

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/PokeAPI/sprites.git "$RUNNER_TEMP/sprites"
          git -C "$RUNNER_TEMP/sprites" sparse-checkout set --no-cone \
            '/sprites/pokemon/*.png' \
            '/sprites/pokemon/other/showdown/*.gif'

          rm -rf api sprites
          mv "$RUNNER_TEMP/api-data/data/api" api
          mv "$RUNNER_TEMP/sprites/sprites" sprites

          find api/v2 -type f -print0 | xargs -0 sed -i \
            -e 's#https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/#/sprites/#g' \
            -e 's#https://raw.githubusercontent.com/PokeAPI/cries/main/cries/#/cries/#g'

      - name: Commit changes
        run: |
          git add api sprites
          git diff --cached --quiet && exit 0

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update PokeAPI data"

          git push
